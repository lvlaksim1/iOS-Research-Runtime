name: Windows Build

on:
  push:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: tools/ios-ramdisk-tool/go.mod

      - name: Build bundled ramdisk helper
        working-directory: tools/ios-ramdisk-tool
        run: |
          go mod tidy
          Write-Host "----- BEGIN GENERATED GO.SUM -----"
          Get-Content go.sum
          Write-Host "----- END GENERATED GO.SUM -----"
          go test ./...
          go build -trimpath -ldflags="-s -w" -o ../../publish-tools/ios-ramdisk-tool.exe .

      - name: Restore application
        run: dotnet restore src/IOSResearchRuntime/IOSResearchRuntime.csproj

      - name: Restore tests
        run: dotnet restore tests/IOSResearchRuntime.Tests/IOSResearchRuntime.Tests.csproj

      - name: Restore integration harness
        run: dotnet restore tools/IOSResearchRuntime.Integration/IOSResearchRuntime.Integration.csproj

      - name: Build
        run: dotnet build src/IOSResearchRuntime/IOSResearchRuntime.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/IOSResearchRuntime.Tests/IOSResearchRuntime.Tests.csproj -c Release --no-restore

      - name: Build integration harness
        run: dotnet build tools/IOSResearchRuntime.Integration/IOSResearchRuntime.Integration.csproj -c Release --no-restore

      - name: Publish self-contained Windows x64
        run: >
          dotnet publish src/IOSResearchRuntime/IOSResearchRuntime.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Bundle native helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish/tools -Force | Out-Null
          Copy-Item publish-tools/ios-ramdisk-tool.exe publish/tools/ios-ramdisk-tool.exe
          if (!(Test-Path publish/tools/ios-ramdisk-tool.exe)) { throw "ramdisk helper missing from application bundle" }

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Research-Runtime-win-x64
          path: publish/**
          if-no-files-found: error
          retention-days: 14
