name: rcodesign Windows Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rcodesign-windows-gate.yml'
      - 'runtime/codesign/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned apple-platform-rs source
        shell: pwsh
        run: |
          git clone https://github.com/indygreg/apple-platform-rs.git apple-platform-rs
          Set-Location apple-platform-rs
          git checkout 0ebbd2ef3b96d5adccc30b1cad4deea38cd735c4
          if ((git rev-parse HEAD).Trim() -ne "0ebbd2ef3b96d5adccc30b1cad4deea38cd735c4") {
            throw "apple-platform-rs pin mismatch"
          }

      - name: Patch explicit digest preservation
        shell: pwsh
        run: |
          $path = "apple-platform-rs/apple-codesign/src/signing_settings.rs"
          $text = Get-Content $path -Raw
          $old = @'
            if need_sha1_sha256 {
                // This logic is a bit wonky. We want SHA-1 to be present on all binaries
'@
          $new = @'
            let digest_is_explicit = self.digest_type.contains_key(&scope_main)
                || self.digest_type.contains_key(&scope_index)
                || self.digest_type.contains_key(&scope_arch);

            if need_sha1_sha256 && !digest_is_explicit {
                // This logic is a bit wonky. We want SHA-1 to be present on all binaries
'@
          if (!$text.Contains($old)) { throw "expected signing_settings.rs patch anchor not found" }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -NoNewline
          git -C apple-platform-rs diff --check
          git -C apple-platform-rs diff -- apple-codesign/src/signing_settings.rs

      - name: Focused regression test
        shell: pwsh
        run: |
          $path = "apple-platform-rs/apple-codesign/src/signing_settings.rs"
          $text = Get-Content $path -Raw
          if ($text -notmatch 'digest_is_explicit = self\.digest_type\.contains_key\(&scope_main\)') {
            throw "explicit-digest guard missing"
          }
          if ($text -notmatch 'if need_sha1_sha256 && !digest_is_explicit') {
            throw "compatibility fallback guard missing"
          }
          if ($text -notmatch 'self\.set_digest_type\(scope_main\.clone\(\), DigestType::Sha1\)') {
            throw "unspecified compatibility fallback was removed"
          }
          if ($text -notmatch 'self\.add_extra_digest\(scope_main\.clone\(\), DigestType::Sha256\)') {
            throw "unspecified SHA256 alternate fallback was removed"
          }

      - name: Build patched pinned rcodesign
        shell: pwsh
        run: |
          Set-Location apple-platform-rs
          cargo build --locked --release -p apple-codesign --bin rcodesign
          $exe = Resolve-Path "target/release/rcodesign.exe"
          "CODESIGN_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify rcodesign executable
        shell: pwsh
        run: |
          & $env:CODESIGN_EXE --version

      - name: Download iOS CLI Mach-O fixture
        shell: pwsh
        run: |
          Invoke-WebRequest "https://raw.githubusercontent.com/jprx/ios-cli-tools/main/prebuilt.tar.gz" -OutFile ios-cli-tools.tar.gz
          $sysrootHash = (Get-FileHash ios-cli-tools.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "IOS_CLI_TOOLS_SHA256=$sysrootHash"
          New-Item -ItemType Directory -Path fixture | Out-Null
          tar -xzf ios-cli-tools.tar.gz -C fixture
          $bash = Get-ChildItem fixture -Recurse -File | Where-Object { $_.Name -eq "bash" } | Select-Object -First 1
          if (!$bash) { throw "bash Mach-O fixture not found" }
          "MACHO_FIXTURE=$($bash.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Ad-hoc sign Mach-O on Windows
        shell: pwsh
        run: |
          $signed = Join-Path $env:RUNNER_TEMP "bash.signed"
          & $env:CODESIGN_EXE sign -C /dev/null --binary-identifier com.apple.bash --digest sha256 $env:MACHO_FIXTURE $signed
          if ($LASTEXITCODE -ne 0) { throw "rcodesign sign failed" }
          if (!(Test-Path $signed)) { throw "signed Mach-O not created" }

          $info = & $env:CODESIGN_EXE print-signature-info -C /dev/null $signed 2>&1
          $info | Out-Host

          $lines = @($info)
          $slot = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match 'slot:\s+CodeDirectory \(0\)') {
              $slot = $i
              break
            }
          }
          if ($slot -lt 0) { throw "primary CodeDirectory not found" }

          $primaryEnd = $lines.Count
          for ($i = $slot + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "slot:\s+'?CodeDirectory Alternate") { $primaryEnd = $i; break }
          }
          $primaryBlock = ($lines[$slot..($primaryEnd - 1)] -join "`n")
          if ($primaryBlock -notmatch 'digest_type:\s+sha256') { throw "primary CodeDirectory digest_type is not sha256" }
          if (($lines -join "`n") -match "slot:\s+'?CodeDirectory Alternate") { throw "alternate CodeDirectory present" }

          $sha256 = $null
          for ($i = $slot + 1; $i -lt [Math]::Min($slot + 10, $lines.Count); $i++) {
            if ($lines[$i] -match 'sha256:\s+([0-9a-fA-F]{64})') {
              $sha256 = $Matches[1].ToLowerInvariant()
              break
            }
          }
          if (!$sha256) { throw "CodeDirectory SHA-256 not found" }

          $cdhash = $sha256.Substring(0, 40)
          Write-Host "CODEDIRECTORY_SHA256=$sha256"
          Write-Host "CDHASH=$cdhash"

      - name: Upload signed proof
        uses: actions/upload-artifact@v4
        with:
          name: rcodesign-windows-proof
          path: |
            apple-platform-rs/apple-codesign/src/signing_settings.rs
          if-no-files-found: error
          retention-days: 14
