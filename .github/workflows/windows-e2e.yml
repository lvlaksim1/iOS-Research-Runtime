name: Windows End-to-End Boot

on:
  push:
    branches:
      - main
    paths:
      - 'runtime/resources.json'
      - 'runtime/tools.json'
      - 'runtime/ramdisk/**'
      - 'runtime/codesign/**'
      - 'scripts/build-patched-rcodesign.ps1'
      - 'runtime/firmware/**'
      - 'src/IOSResearchRuntime/Core/**'
      - 'src/IOSResearchRuntime/Models/**'
      - 'src/IOSResearchRuntime/Services/**'
      - 'tools/ios-ramdisk-tool/**'
      - 'tools/IOSResearchRuntime.Integration/**'
      - '.github/workflows/windows-e2e.yml'
      - '.github/workflows/qemu-sptm-windows.yml'
      - 'scripts/check_qemu_gate_origin.py'
      - 'scripts/prepare_e2e_upload_evidence.py'
      - 'scripts/collect_text_evidence.py'
      - 'scripts/check_m3_ioprint_tar_mode.py'
      - 'scripts/fix_m3_ioprint_tar_mode.py'
      - 'tests/python/test_check_m3_ioprint_tar_mode.py'
      - 'tests/python/test_fix_m3_ioprint_tar_mode.py'
      - 'tests/python/test_m3_ioprint_windows_integration.py'
      - 'tests/python/test_m3_ioprint_windows_python_setup.py'
      - 'scripts/check_m3_ioprint_macho_platform.py'
      - 'tests/python/test_m3_ioprint_macho_platform.py'

concurrency:
  group: windows-e2e-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  qemu-gate:
    uses: ./.github/workflows/qemu-sptm-windows.yml

  boot-proof:
    needs: qemu-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout current main application
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Bind QEMU gate to current workflow run
        id: qemu
        shell: pwsh
        run: |
          "run_id=${{ github.run_id }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "head_sha=${{ github.sha }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "QEMU_GATE_MODE=SAME_RUN_REUSABLE_WORKFLOW"
          "QEMU_GATE_RUN=${{ github.run_id }}"
          "QEMU_GATE_SHA=${{ github.sha }}"

      - name: Record tested revisions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path e2e-evidence -Force | Out-Null
          $appSha = (git rev-parse HEAD).Trim()
          "QEMU_GATE_RUN=${{ steps.qemu.outputs.run_id }}" | Set-Content e2e-evidence/revisions.txt
          "QEMU_GATE_SHA=${{ steps.qemu.outputs.head_sha }}" | Add-Content e2e-evidence/revisions.txt
          "APPLICATION_SHA=$appSha" | Add-Content e2e-evidence/revisions.txt
          "QEMU_GATE_MODE=SAME_RUN_REUSABLE_WORKFLOW" | Add-Content e2e-evidence/revisions.txt
          "QEMU_UPSTREAM_SHA=2867d847d3471560e773120ee50c42dbcbb6d60b" | Add-Content e2e-evidence/revisions.txt

      - name: Probe pinned iokit-utils release asset provenance
        shell: pwsh
        run: |
          $asset = Join-Path $env:RUNNER_TEMP "iokit-utils-1.4.0.tar.xz"
          $extract = Join-Path $env:RUNNER_TEMP "iokit-utils-1.4.0"
          $url = "https://github.com/Siguza/iokit-utils/releases/download/1.4.0/iokit-utils.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile $asset
          $length = (Get-Item $asset).Length
          if ($length -ne 27460) { throw "Unexpected iokit-utils 1.4.0 asset size: $length" }
          $assetHash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          tar -xJf $asset -C $extract
          $ioprint = Join-Path $extract "ios/ioprint"
          if (!(Test-Path $ioprint)) { throw "Pinned asset does not contain ios/ioprint" }
          $ioprintHash = (Get-FileHash -Algorithm SHA256 $ioprint).Hash.ToLowerInvariant()
          $ioprintSize = (Get-Item $ioprint).Length
          $pinnedIoprintSha256 = "8d1425e8f63416da64ed4c5789109eff2535b44327469d879134eb89c31320ee"
          if ($ioprintHash -ne $pinnedIoprintSha256) {
            throw "Pinned iokit-utils 1.4.0 ioprint SHA-256 mismatch: expected $pinnedIoprintSha256; observed $ioprintHash"
          }
          $ioprintSize = (Get-Item $ioprint).Length
          @(
            "IOKIT_UTILS_RELEASE=1.4.0"
            "IOKIT_UTILS_RELEASE_COMMIT=df1d6b5172a19950edac74b8a05a28c12b34bba9"
            "IOKIT_UTILS_ASSET_ID=70955572"
            "IOKIT_UTILS_ASSET_SIZE=$length"
            "IOKIT_UTILS_ASSET_SHA256=$assetHash"
            "IOKIT_UTILS_IOS_IOPRINT_SIZE=$ioprintSize"
            "IOKIT_UTILS_IOS_IOPRINT_SHA256_EXPECTED=$pinnedIoprintSha256"
            "IOKIT_UTILS_IOS_IOPRINT_SHA256=$ioprintHash"
          ) | Set-Content e2e-evidence/iokit-utils-provenance.txt
          $objdump = Get-Command llvm-objdump -ErrorAction SilentlyContinue
          if ($objdump) {
            & $objdump.Source --macho --dylibs-used $ioprint 2>&1 | Tee-Object -FilePath e2e-evidence/ioprint-dylibs.txt
          } else {
            "LLVM_OBJDUMP_UNAVAILABLE" | Set-Content e2e-evidence/ioprint-dylibs.txt
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: tools/ios-ramdisk-tool/go.sum

      - name: Setup pinned Python for ioprint archive checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate pinned ioprint Mach-O arm64 iOS platform
        shell: pwsh
        run: |
          $ioprint = Join-Path $env:RUNNER_TEMP "iokit-utils-1.4.0/ios/ioprint"
          python -B scripts/check_m3_ioprint_macho_platform.py --input "$ioprint" --output "e2e-evidence/ioprint-macho-platform.json"
          if ($LASTEXITCODE -ne 0) { throw "ioprint Mach-O platform gate failed" }

      - name: Verify Python and run ioprint pre-boot tests
        shell: pwsh
        run: |
          python --version
          python -B -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          python -B -m py_compile scripts/check_m3_ioprint_tar_mode.py scripts/fix_m3_ioprint_tar_mode.py tests/python/test_check_m3_ioprint_tar_mode.py tests/python/test_fix_m3_ioprint_tar_mode.py tests/python/test_m3_ioprint_windows_integration.py tests/python/test_m3_ioprint_windows_python_setup.py scripts/check_m3_ioprint_macho_platform.py tests/python/test_m3_ioprint_macho_platform.py
          if ($LASTEXITCODE -ne 0) { throw "ioprint Python syntax checks failed" }
          python -B -m unittest discover -s tests/python -p 'test_*ioprint*.py' -v
          if ($LASTEXITCODE -ne 0) { throw "ioprint pre-boot tests failed" }

      - name: Download QEMU runtime from gate
        uses: actions/download-artifact@v4
        with:
          name: qemu-sptm-windows-gate
          path: qemu-gate-artifact

      - name: Setup Python for QEMU gate origin verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify downloaded QEMU gate origin
        shell: pwsh
        env:
          EXPECTED_GATE_RUN: ${{ steps.qemu.outputs.run_id }}
          EXPECTED_GATE_SHA: ${{ steps.qemu.outputs.head_sha }}
        run: |
          # Refuse reparse points in downloaded artifact ancestors and files.
          foreach ($relative in @(
            'qemu-gate-artifact',
            'qemu-gate-artifact/runtime',
            'qemu-gate-artifact/gate-origin.txt',
            'qemu-gate-artifact/runtime/qemu-system-aarch64.exe',
            'e2e-evidence'
          )) {
            $item = Get-Item -LiteralPath $relative -Force -ErrorAction Stop
            if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
              throw "QEMU gate evidence has a reparse point: $relative"
            }
          }
          & python scripts/check_qemu_gate_origin.py `
            --receipt qemu-gate-artifact/gate-origin.txt `
            --binary qemu-gate-artifact/runtime/qemu-system-aarch64.exe `
            --expected-run-id $env:EXPECTED_GATE_RUN `
            --expected-sha $env:EXPECTED_GATE_SHA `
            --output e2e-evidence/qemu-gate-origin-check.json
          if ($LASTEXITCODE -ne 0) { throw "QEMU gate origin check failed" }
          if (!(Test-Path -LiteralPath e2e-evidence/qemu-gate-origin-check.json -PathType Leaf)) {
            throw "QEMU gate origin check produced no receipt"
          }

      - name: Stage tested QEMU runtime
        shell: pwsh
        env:
          EXPECTED_GATE_RUN: ${{ steps.qemu.outputs.run_id }}
          EXPECTED_GATE_SHA: ${{ steps.qemu.outputs.head_sha }}
        run: |
          $source = Join-Path $PWD "qemu-gate-artifact/runtime"
          $destination = Join-Path $PWD "tools/qemu-sptm"

          if (!(Test-Path (Join-Path $source "qemu-system-aarch64.exe"))) {
            throw "QEMU gate artifact does not contain qemu-system-aarch64.exe"
          }

          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item (Join-Path $source "*") $destination -Recurse -Force

          # Verify the staged executable again before executing it.
          & python scripts/check_qemu_gate_origin.py `
            --receipt qemu-gate-artifact/gate-origin.txt `
            --binary (Join-Path $destination "qemu-system-aarch64.exe") `
            --expected-run-id $env:EXPECTED_GATE_RUN `
            --expected-sha $env:EXPECTED_GATE_SHA `
            --output e2e-evidence/qemu-gate-staged-origin-check.json
          if ($LASTEXITCODE -ne 0) { throw "Staged QEMU executable differs from gate receipt" }

          $systemRoot = $env:SystemRoot
          $oldPath = $env:PATH
          try {
            $env:PATH = "$destination;$systemRoot\System32;$systemRoot"
            $machines = & (Join-Path $destination "qemu-system-aarch64.exe") -M help 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "Staged QEMU runtime failed with exit code $LASTEXITCODE"
            }
            if (-not ($machines -match '(?m)^darwin\s')) {
              throw "Staged QEMU runtime does not expose darwin machine"
            }
          }
          finally {
            $env:PATH = $oldPath
          }

      - name: Build bundled ramdisk helper
        working-directory: tools/ios-ramdisk-tool
        shell: pwsh
        run: |
          go mod download
          go mod tidy -diff
          git diff --exit-code -- go.mod go.sum
          ./prepare-apfs-overlay.ps1
          go test ./...
          go build -trimpath -ldflags="-s -w" -o ../ios-ramdisk-tool.exe .
          if (!(Test-Path ../ios-ramdisk-tool.exe)) {
            throw "ios-ramdisk-tool.exe was not built"
          }

      - name: Build bundled patched rcodesign
        shell: pwsh
        run: |
          ./scripts/build-patched-rcodesign.ps1 -OutputDirectory (Join-Path $PWD "tools/rcodesign")
          if (!(Test-Path "tools/rcodesign/rcodesign.exe")) {
            throw "bundled patched rcodesign.exe was not staged"
          }
          if (!(Test-Path "tools/rcodesign/.version")) {
            throw "bundled patched rcodesign version marker was not staged"
          }

      - name: Restore integration harness
        run: dotnet restore tools/IOSResearchRuntime.Integration/IOSResearchRuntime.Integration.csproj

      - name: Run provisioning and Darwin root-shell proof
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "ios-research-runtime-e2e"
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $evidence = Join-Path $PWD "e2e-evidence"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          dotnet run --project tools/IOSResearchRuntime.Integration/IOSResearchRuntime.Integration.csproj -c Release --no-restore -- --application-directory "$PWD" --data-directory "$data" --timeout-minutes 60 2>&1 | Tee-Object -FilePath (Join-Path $evidence "integration.log")

          if ($LASTEXITCODE -ne 0) {
            throw "End-to-end integration harness failed with exit code $LASTEXITCODE"
          }

          Copy-Item "qemu-gate-artifact/runtime-summary.txt" $evidence -ErrorAction SilentlyContinue
          Copy-Item "qemu-gate-artifact/standalone-machine-list.txt" $evidence -ErrorAction SilentlyContinue

      - name: Setup Python for native ADT evidence
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Collect failure evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $PWD "e2e-evidence"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $data = Join-Path $env:RUNNER_TEMP "ios-research-runtime-e2e"
          $logs = Join-Path $data "logs"
          $raw = Join-Path $logs "dtree.raw"
          $capture = Join-Path $evidence "native-apcie-properties.json"
          $status = Join-Path $evidence "native-apcie-capture-status.txt"

          if (Test-Path -LiteralPath $raw -PathType Leaf) {
            try {
              & python scripts/capture_native_apcie_properties.py --input $raw --output $capture 2>$null
              if ($LASTEXITCODE -ne 0) { throw "capture failed" }
              if (!(Test-Path -LiteralPath $capture -PathType Leaf)) { throw "capture missing" }
              if ((Get-Item -LiteralPath $capture).Length -gt 65536) { throw "capture too large" }
              "CAPTURE_OK_TEXT_ONLY" | Set-Content -LiteralPath $status
            }
            catch {
              Remove-Item -LiteralPath $capture -Force -ErrorAction SilentlyContinue
              "CAPTURE_FAILED" | Set-Content -LiteralPath $status
            }
          }
          else {
            "RAW_ADT_NOT_AVAILABLE" | Set-Content -LiteralPath $status
          }

          # Fail-closed bounded UTF-8 allowlist; raw firmware never enters artifacts.
          $bootLogs = Join-Path $evidence "boot-logs"
          $textStatus = Join-Path $evidence "text-evidence-copy-status.txt"
          & python scripts/collect_text_evidence.py --source $logs --destination $bootLogs --status $textStatus
          if ($LASTEXITCODE -ne 0) { "TEXT_EVIDENCE_FAILED" | Set-Content -LiteralPath $textStatus }

          # Direct diagnostic files stay on the runner; never enumerate absolute paths.

      - name: Prepare minimized E2E upload
        id: prepare_upload
        if: always()
        shell: pwsh
        run: |
          & python scripts/prepare_e2e_upload_evidence.py --source e2e-evidence --destination e2e-upload --expected-run-id "${{ github.run_id }}" --expected-sha "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Evidence minimization failed" }

      - name: Upload end-to-end evidence
        if: always() && steps.prepare_upload.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-darwin-windows-e2e
          path: |
            e2e-upload/evidence-summary.json
            e2e-upload/evidence-files.txt
          if-no-files-found: warn
          retention-days: 14
