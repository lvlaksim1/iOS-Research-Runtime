name: qemu-sptm Windows Gate

on:
  push:
    paths:
      - '.github/workflows/qemu-sptm-windows.yml'
      - 'runtime/qemu/**'

concurrency:
  group: qemu-sptm-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-qemu:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: false
          cache: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python

      - name: Clone pinned qemu-sptm
        shell: msys2 {0}
        run: |
          git clone https://github.com/jprx/qemu-sptm.git qemu-sptm
          cd qemu-sptm
          git checkout 2867d847d3471560e773120ee50c42dbcbb6d60b

      - name: Apply Windows portability patch
        shell: msys2 {0}
        run: |
          cd qemu-sptm
          git apply --check ../runtime/qemu/patches/0001-win32-portability.patch
          git apply ../runtime/qemu/patches/0001-win32-portability.patch
          git diff --check
          git diff --stat

      - name: Restore QEMU build cache
        id: qemu-build-cache
        uses: actions/cache/restore@v4
        with:
          path: qemu-sptm/build
          key: qemu-sptm-win64-2867d847-headless-v1-${{ hashFiles('runtime/qemu/patches/0001-win32-portability.patch') }}

      - name: Configure qemu-sptm
        shell: msys2 {0}
        run: |
          cd qemu-sptm
          mkdir -p build
          cd build
          if [ ! -f build.ninja ]; then
            ../configure \
              --target-list=aarch64-softmmu \
              --disable-pvg \
              --disable-werror \
              --disable-docs \
              --disable-gtk \
              --disable-sdl \
              --disable-vnc \
              --disable-opengl \
              --disable-curses \
              --disable-slirp \
              --disable-plugins \
              --disable-tools \
              --disable-guest-agent
          fi

      - name: Build qemu-sptm
        shell: msys2 {0}
        run: |
          cd qemu-sptm/build
          ninja qemu-system-aarch64.exe

      - name: Save QEMU build cache
        if: steps.qemu-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: qemu-sptm/build
          key: qemu-sptm-win64-2867d847-headless-v1-${{ hashFiles('runtime/qemu/patches/0001-win32-portability.patch') }}

      - name: Verify Darwin machine
        shell: msys2 {0}
        run: |
          cd qemu-sptm/build
          ./qemu-system-aarch64.exe -M help | tee machine-list.txt
          grep -E '^darwin[[:space:]]' machine-list.txt

      - name: Stage standalone QEMU runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          runtime_dir="$PWD/qemu-proof/runtime"
          mkdir -p "$runtime_dir"
          cp qemu-sptm/build/qemu-system-aarch64.exe "$runtime_dir/"
          cp qemu-sptm/build/machine-list.txt qemu-proof/

          # MSYS2 ldd resolves the complete imported DLL closure for this PE.
          ldd qemu-sptm/build/qemu-system-aarch64.exe | tee qemu-proof/ldd.txt
          while IFS= read -r dll; do
            [ -f "$dll" ] || continue
            case "$dll" in
              /mingw64/bin/*.dll)
                cp -f "$dll" "$runtime_dir/"
                ;;
            esac
          done < <(
            ldd qemu-sptm/build/qemu-system-aarch64.exe |
              sed -nE 's#.*=>[[:space:]]+([^[:space:]]+\.dll).*#\1#p; s#^[[:space:]]*([^[:space:]]+\.dll).*#\1#p' |
              sort -u
          )

          test -f "$runtime_dir/qemu-system-aarch64.exe"
          dll_count=$(find "$runtime_dir" -maxdepth 1 -type f -iname '*.dll' | wc -l)
          test "$dll_count" -gt 0

          mkdir -p "$runtime_dir/provenance"
          cp runtime/qemu/UPSTREAM.md "$runtime_dir/provenance/"
          cp runtime/qemu/patches/0001-win32-portability.patch "$runtime_dir/provenance/"
          cp qemu-sptm/COPYING "$runtime_dir/LICENSE-QEMU.txt"

          (
            cd "$runtime_dir"
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS.txt
          )

          printf '%s\n' "DLL_COUNT=$dll_count" | tee qemu-proof/runtime-summary.txt
          printf '%s\n' "UPSTREAM_COMMIT=2867d847d3471560e773120ee50c42dbcbb6d60b" | tee -a qemu-proof/runtime-summary.txt

      - name: Verify standalone QEMU runtime
        shell: pwsh
        run: |
          $runtime = (Resolve-Path "qemu-proof/runtime").Path
          $systemRoot = $env:SystemRoot
          $env:PATH = "$runtime;$systemRoot\System32;$systemRoot"
          $output = & "$runtime\qemu-system-aarch64.exe" -M help 2>&1
          $output | Set-Content -Encoding utf8 "qemu-proof/standalone-machine-list.txt"
          if ($LASTEXITCODE -ne 0) {
            throw "Standalone qemu-system-aarch64.exe failed with exit code $LASTEXITCODE"
          }
          if (-not ($output -match '(?m)^darwin\s')) {
            throw "Standalone QEMU runtime does not expose the darwin machine"
          }

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-sptm-windows-gate
          path: qemu-proof/**
          if-no-files-found: error
          retention-days: 14
