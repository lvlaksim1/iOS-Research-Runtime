name: Ramdisk Tool Windows

on:
  push:
    paths:
      - '.github/workflows/ramdisk-tool-windows.yml'
      - 'tools/ios-ramdisk-tool/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: tools/ios-ramdisk-tool/go.mod

      - name: Resolve pinned modules
        working-directory: tools/ios-ramdisk-tool
        run: go mod tidy

      - name: Test
        working-directory: tools/ios-ramdisk-tool
        run: go test ./...

      - name: Build Windows x64
        working-directory: tools/ios-ramdisk-tool
        run: go build -trimpath -ldflags="-s -w" -o ../../publish-tools/ios-ramdisk-tool.exe .

      - name: Smoke test
        shell: pwsh
        run: |
          if (!(Test-Path publish-tools/ios-ramdisk-tool.exe)) { throw "missing ios-ramdisk-tool.exe" }
          & publish-tools/ios-ramdisk-tool.exe -h 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "helper help failed: $LASTEXITCODE" }

      - name: Upload helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ramdisk-tool-win-x64
          path: publish-tools/ios-ramdisk-tool.exe
          if-no-files-found: error
          retention-days: 14
