name: APFS Evidence Marker

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apfs-evidence-marker.yml'

permissions:
  actions: read
  contents: read

jobs:
  expose-diff:
    runs-on: windows-latest
    steps:
      - name: Download exact E2E evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35551527247 --repo ${{ github.repository }} --name ios-darwin-windows-e2e --dir evidence

      - name: Encode exact APFS failure marker
        id: diff
        shell: pwsh
        run: |
          $log = Get-ChildItem evidence -Recurse -Filter integration.log | Select-Object -First 1 -ExpandProperty FullName
          if (!$log) { throw 'integration.log not found in exact E2E evidence' }

          $lines = Get-Content $log
          $matches = $lines | Where-Object {
            $_ -match '(?i)apfs|mountroot|root device|root_device|vfsop_mount|md0|errno'
          }
          if (!$matches) { throw 'No APFS/mountroot discriminator found in exact E2E log' }

          $selected = $matches | Select-Object -Last 8
          $selected | Set-Content marker-evidence.txt
          $joined = ($selected -join '__') -replace '[^A-Za-z0-9._=-]', '_'
          if ($joined.Length -gt 220) { $joined = $joined.Substring(0,220) }
          $marker = 'apfsfail-' + $joined
          "marker=$marker" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish metadata-visible marker
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.diff.outputs.marker }}
          path: marker-evidence.txt
          retention-days: 2
